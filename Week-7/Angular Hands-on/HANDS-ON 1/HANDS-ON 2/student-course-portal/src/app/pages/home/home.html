<h1>{{ portalName }}</h1>

<p>Welcome to Student Course Portal</p>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Search courses">

<p>Searching for: {{ searchTerm }}</p>

<!--
[property] = One-way binding (Component → DOM)
[(ngModel)] = Two-way binding (DOM ↔ Component)
-->
